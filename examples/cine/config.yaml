  <!-- cine-preloaded:novel-storyboard:start -->
  以下是必读创作流程，已随入口完整返回，无需再次读取 pass 参考文件。
  读取原生剧本、当前角色/场景/道具设定及剧本交接说明；输出仍为 `segments/cuts`。
  风格服从剧本。电影感来自画面选择与连续的声画设计，不来自术语数量。

  #### 整场视觉设计

  切镜前，在现有交付说明中按场写出以下决策；只写本场需要的内容，不再建一套 schema：

  1. **观看重点**：这场让观众先知道什么、何时发现什么，与谁共享视角？保留剧本的类型与反差。
  2. **空间和调度**：地标、机位所在侧、人物初始站位、视线与出入方向、关键距离及道具持有状态。区分场景方向和画面左右；涉及躲藏时明确遮挡面与观察者视线，摄影机看得见不等于对手看得见。位置变化须有依据。
  3. **构图与景别**：前中后景如何形成关系，遮挡和留白表达什么，何时接近人物、何时让环境压过人物。
  4. **光影与材质**：从已确认美术设定选择有来源的主光、背景亮度与色彩关系，保持跨镜方向和材质连续。
  5. **表演与声音**：给决定和反应留多久，何处用环境声、画外音或安静衔接；音乐随整场变化，不每段换曲。

  随后把这些选择落实到 `frame` 的构图/状态、`camera` 的运动选择和每段视频提示词的动作/声源中。
  说明里写了但实际提示词没写，不算完成交接。参考图只选匹配本次版本、角色状态和场景的真实资产。

  #### 连续性与转场范围

  一致性按叙事范围约束：同一身份不等于永不换装，同一物件不等于永不换手，同一场景不等于全片不能换场。区分需保持的身份特征、同场空间规则和剧情批准的状态变化；参考图状态不匹配时明确差异，不能谎称已验证。
  关键物件跨镜换手、重新出现或成为结尾笑点时，回查上一镜持有者、交接依据及本镜起始状态。合理省略可保留；缺失的关键交接只补最短必要线索，不自动拆成动作工序。
  匹配剪辑只精确锁定承担连接作用的构图、物件位置、视角或运动方向；注明跨切点允许改变的时间、环境和人物状态。其他表演仍自然展开，不把局部匹配要求扩成全片冻结。

  #### 前三秒钩子

  检查第一段时间线的 0.00–3.00 秒：具体异常、冲突或关系是否已经可见/可听，而非要等片头或风景介绍结束？
  记录钩子出现秒点及对应镜号，解释观众会追问什么；若内容在长镜头内部出现，明确内部发生时刻。
  这不要求三秒切一次，也不要求主体运动。首帧可以直接揭示矛盾；声音钩子须有明确声源和画面配合。
  `hookBeat` 结构通过仅证明节拍位置，不能替代前三秒内容审查，更不能证明真实观众留存率。

  #### 分段与切镜

  - 严禁1节拍1镜头流水账切分：禁止把剧本每个单节拍机械切成一镜。一个镜头应自然容纳 2–3 个连贯微节拍（动作发起 + 过程 + 结果），让画面有因果与呼吸感；仅突发重音或关键动作重折才用单拍切镜。
  - 严禁同主体同景别死寂跳切（Jump-cut Redline）：相邻镜头对准同一主体时，严禁连续使用相同景别（如中景接中景、特写接特写）；对话必须使用正反打过肩（Shot/Reverse Shot）或双人同框（Two-shot）交替推进，禁止同机位自说自话切脸抽搐。
  - 空间建立与视线匹配（Establishing & POV）：场次开端必须先有全景或中全景（Establishing Shot）交代人物在空间中的起始位置与环境，严禁在未交代空间前直接突兀贴脸切特写；人物看向画外时，下一镜必须无缝承接其视线落点（POV）。
  - 动作匹配剪辑（Match on Action）：上一镜发起的伸手、转头、起伏等动作，下一镜必须在动作运动过程中无缝切入，保持运动矢量守恒，禁止前一镜动作未完、下一镜凭空位移。
  - 画布视频卡与分镜表必须 100% 结构一致：画布上的 video_prompt 视频卡必须严格继承分镜表（storyboard.json）中的镜头数量、累加切点时间码（如 3 镜必须严格对应 [Shot 1]、[Shot 2]、[Shot 3] 和真实切点秒数），严禁大模型私自压缩镜头数、随意改写切点时间码，或跨段落提前剧透下一段动作；全片多少个生成段，画布必须完整对应多少张视频卡，严禁只建前几张就停机。
  - 戏剧节拍、镜头、生成段不一一对应：一镜可容纳多个节拍，一段可包含多镜；五秒事件段落不自动变成五秒切镜。先决定观众需要看见什么变化，再决定是否切。
  - 镜内按动机、因果、先后和起止状态写连续表演，不把剧本估时展开为每次眼神/伸手的绝对区间。默认只为实际切点、总时长和必要同步事件保留时间锚点，不能删除用户指定的踩点或口型要求。
  - 段是一次生成调用，不是强制的戏剧段落。按剧情单元与实际模型能力分段；当前 H3 合同每段不跨场且不超过15秒。
  - 镜长按信息、对白、动作与反应确定。现有 `params.minCutSeconds/maxCutSeconds` 默认2–5秒，可按已确认节奏配置；不编造开关或绕过真实限制。
  - 双人同框、听者反应、正反打或长镜都可选。切换应带来信息、关系或感受的变化，不按问答轮次机械切脸。
  - 固定或移动都有用途：揭示信息、跟随行为、改变关系。没有动机就不添加运动，不强制浅景深或统一滤镜。
  - 动作匹配保留起止状态。跨生成段重述必要状态，不能假定模型记得前段；运镜不能掩盖位置和道具错误。
  - 使用关键帧工作流时单切一张关键帧；用户只需要角色/场景参考时不强制生分镜图，缺图状态如实保留。需表现交互时明确参与者与起止状态，不堆多次换装、变形与长对白。
  - 逐镜检查行动、对白、移动距离和反应是否装得下，尤其远距离往返、连续交接和状态变化。镜头多不等于负载合理，没写秒表也可能过载；时长未知只标风险，不武断判定执行失败。优先删重复或重分现有镜长，保留因果与结局，不擅自突破用户总时长。

  #### H3 最终交接

  制作包的 `h3Prompt` 是创作草稿，不等于可直接提交的最终 H3 输入。走 V3 时使用其原生提示词优化入口，根据实际连接的参考资产确定模式与编号，不靠记忆重写一套格式。
  保持角色与空间事实，集中定义参考身份；逐镜只补当下必要的状态变化，不重复整份设定。不得为了“更精确”补造镜内微动作时间码或移动厘米数；确有剧情/同步需要的数值照实保留。
  只有角色/场景参考图时使用 Ref2VA 六段式；不把这些图冒充首帧或分镜图。`<Subject N>` 可指角色或环境，不代表演员人数；在其定义内引用真实来源 `<Picture N>`。
  `retention_analysis` 只写参考内容如何保留、迁移或复用，不写观众留存或开场钩子。前三秒钩子与声画因果写入 `detailed_description` 的时间线，原因先于反应。
  首镜写 `[Shot 1]` 后直接描述；后续用 `[Shot 2] At 00:05.000, the camera cuts to ...`，切点取真实分镜起点且严格递增。不用 `From ... to ...` 范围替代原生切点标记。原生指南的详细描述篇幅建议不等于全提示词上限；避免为任意总字数截掉调度和声画因果。
  按实际参考顺序核对引用覆盖和编号越界；格式通过不能证明空间关系、故事性或成片质量。用户不需要分镜图时不生成，也不声称已存在。

  #### 保持原生生产合同

  `beats` 按原生规则完整、顺序、无重认领；台词逐字保留，画外广播不分配给画内角色的口型。
  镜长变动同步改切点、对齐指令与相关提示词。对白估时之后仍要留表演余量，快念不等于自然。
  景别、运镜词、语言和风格字段遵守当前 validator；H3 格式按 h3-prompt.md，不宣称通用模型兼容。
  引用角色用现有 ID/参考关系绑定；文字身份描述必须区分同场人物，并与参考图一致。
  不同时写“有人”和“无人”，不将纸杯写成塑料杯；实际换行不是字面量反斜线n。
  参考图与提示词冲突先解决冲突，不假设模型必然听某一方。缺图或接口能力不满足时明确标记，不静默丢引用。

  #### 审查与交付

  分别审查故事是否保真、画面选择是否有效、提示词能否执行，再运行真实结构校验。
  每个发现引用具体镜号及实际内容，给修复目标；允许没有发现，不为显得专业强加运镜或解释。
  区分确定断裂、合理省略、待确认意图和生成风险，不把四者统称失败。否定词与正向情节冲突时修正作用范围，不用“无额外人物/环境不变”掩盖已计划的配角或换场。
  已经写进剧情的配角优先列入允许出镜名单，只禁止名单之外的人；除非用户明确限定人数且不可更改，不默认删掉配角，也不撤掉全部人数约束。明确的回忆/状态变化不需要自动补解释，审查只针对仍缺失的连接。
  同阶段最多两轮定点返修。改镜后检查相邻镜、引用资产、对白声源和整场声景，未解决项留下。
  独立审查须实际存在独立上下文，否则如实标为自审。不得把自评分或结构全绿当作电影感通过。
  真实画面需实际观看后评价；文字只能支持设计判断，单帧不能证明表演、运动或声画节奏。
