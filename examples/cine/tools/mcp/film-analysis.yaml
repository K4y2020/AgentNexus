name: cine-film-analysis
transport: stdio
# uv supplies the tools' dependencies (Whisper, scene detection, caption OCR,
# JEV) so the server does not depend on what the host's default python has
# installed. One OpenCV build only: rapidocr requires opencv-python, and the
# headless build would install a second cv2 over it.
command: uv
# `args` are literal (no ${VAR} expansion). The runner resolves the server
# script against the extracted bundle; the server finds its sibling modules
# from __file__.
args:
  - run
  - --no-project
  - --with
  - mcp>=1.2,<2
  - --with
  - faster-whisper
  - --with
  - scenedetect>=0.6.4
  - --with
  - opencv-python
  - --with
  - rapidocr-onnxruntime
  - --with
  - pydantic>=2,<3
  - --with
  - jinja2>=3.1,<4
  - --with
  - filelock>=3
  - --with
  - typesafe-sdk>=0.7.0
  - --with
  - pyyaml
  - python
  - tools/mcp/film_analysis_server.py
