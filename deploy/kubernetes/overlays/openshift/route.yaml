apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: agentnexus
  labels:
    app: agentnexus
spec:
  host: agentnexus.apps.example.com
  to:
    kind: Service
    name: agentnexus
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
