---
# Patch the base server Deployment so the kubernetes sandbox provider works:
#   1. Run as the `agentnexus-server` ServiceAccount (bound by rolebinding.yaml to
#      the pods + secrets Role in role.yaml) so the launcher can manage runner
#      Pods and their per-launch token Secrets.
#   2. Mount the sandbox config.yaml and point AGENTNEXUS_CONFIG at it so the
#      server parses the `sandbox: provider: kubernetes` section.
#
# NOTE: the server image must include the `kubernetes` extra
# (`pip install 'agentnexus[kubernetes]'`) for the provider to import the client.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentnexus
spec:
  template:
    spec:
      serviceAccountName: agentnexus-server
      containers:
        - name: agentnexus
          env:
            - name: AGENTNEXUS_CONFIG
              value: /etc/agentnexus/config.yaml
          volumeMounts:
            - name: sandbox-config
              mountPath: /etc/agentnexus
              readOnly: true
      volumes:
        - name: sandbox-config
          configMap:
            name: agentnexus-sandbox-config
