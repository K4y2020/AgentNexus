---
# RBAC for the kubernetes sandbox provider (on-demand runner Pods).
#
# TWO-NAMESPACE, LEAST-BLAST-RADIUS DESIGN: the server, its DB/PVC and its
# Secrets live in `agentnexus`; the runner Pods live in a SEPARATE
# `agentnexus-sandboxes` namespace. The server SA's pods create/get/delete +
# secrets create/delete rights are scoped (via a Role + RoleBinding) to
# `agentnexus-sandboxes` ONLY — so a compromised server can manage RUNNER Pods but
# CANNOT delete the server/DB Pods, read the server's Secrets, nor (because
# there is no pods/exec grant) execute commands inside any Pod.
#
#   agentnexus-server  — the AgentNexus server runs as this SA (this file; lives in
#                      `agentnexus`). deployment-patch.yaml sets
#                      serviceAccountName: agentnexus-server. The launcher uses its
#                      in-cluster token to manage runner Pods + their token
#                      Secrets in `agentnexus-sandboxes`.
#   agentnexus-runner  — the runner Pods run as this SA (serviceaccount-runner.yaml,
#                      lives in `agentnexus-sandboxes`); it has NO API rights.
#
# Role (role.yaml) + RoleBinding (rolebinding.yaml) live in `agentnexus-sandboxes`;
# the RoleBinding subject is the agentnexus-server SA in `agentnexus` (a
# cross-namespace binding — see rolebinding.yaml). Scope is a namespaced Role
# (NOT a ClusterRole) so the grant can never reach beyond the runner namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentnexus-server
  namespace: agentnexus
  labels:
    app.kubernetes.io/name: agentnexus
    app.kubernetes.io/component: server
