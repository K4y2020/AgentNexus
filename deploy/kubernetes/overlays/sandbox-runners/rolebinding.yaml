---
# CROSS-NAMESPACE binding: this RoleBinding lives in the runner namespace
# `agentnexus-sandboxes` and grants the agentnexus-sandbox-manager Role (also in
# `agentnexus-sandboxes`) to the agentnexus-server SA, which lives in the SEPARATE
# server namespace `agentnexus`. A RoleBinding may reference a subject in another
# namespace, so the server gets runner-Pod management rights in
# `agentnexus-sandboxes` ONLY — never in its own namespace. The subject namespace
# is set explicitly (NOT injected) so the binding is unambiguous. The runner SA
# is deliberately absent — runner Pods need no API access.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentnexus-sandbox-manager
  namespace: agentnexus-sandboxes
  labels:
    app.kubernetes.io/name: agentnexus
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentnexus-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: agentnexus-server
    namespace: agentnexus
