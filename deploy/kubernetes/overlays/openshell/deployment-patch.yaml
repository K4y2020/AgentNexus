apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentnexus
spec:
  template:
    spec:
      serviceAccountName: agentnexus
      containers:
        - name: agentnexus
          volumeMounts:
            - name: openshell-gateway
              mountPath: /home/agentnexus/.config/openshell
              readOnly: true
            - name: server-config
              mountPath: /data/server-config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: openshell-gateway
          secret:
            secretName: openshell-gateway-config
            optional: true
        - name: server-config
          configMap:
            name: agentnexus-server-config
