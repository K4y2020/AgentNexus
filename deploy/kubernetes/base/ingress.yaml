apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentnexus
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - agentnexus.example.com
      secretName: agentnexus-tls
  rules:
    - host: agentnexus.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentnexus
                port:
                  name: http
