apiVersion: v1
kind: Secret
metadata:
  name: agentnexus-secrets
  labels:
    app: agentnexus
type: Opaque
stringData:
  # Replace with your actual database connection string.
  DATABASE_URL: "postgresql+psycopg://agentnexus:changeme@your-db-host:5432/agentnexus"
  # Generate with: openssl rand -hex 32
  AGENTNEXUS_ACCOUNTS_COOKIE_SECRET: "changeme"
