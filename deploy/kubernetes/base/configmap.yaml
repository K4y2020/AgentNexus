apiVersion: v1
kind: ConfigMap
metadata:
  name: agentnexus-config
  labels:
    app: agentnexus
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  ARTIFACT_DIR: "/data/artifacts"
  # Comma-separated release features; empty keeps every feature off.
  AGENTNEXUS_FEATURES: ""
  AGENTNEXUS_ADMIN_CREDENTIALS_PATH: "/data/admin-credentials"
  AGENTNEXUS_AUTH_ENABLED: "1"
  AGENTNEXUS_AUTH_PROVIDER: "accounts"
  AGENTNEXUS_ACCOUNTS_AUTO_OPEN: "0"
